[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redrob-ranker"
version = "1.0.0"
description = "AI Candidate Ranking System for the India Runs Data & AI Challenge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Team Discern"},
]

dependencies = [
    "numpy>=1.24",
    "pyarrow>=12.0",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "sentence-transformers>=2.2",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
space = [
    "gradio>=4.0",
]

[tool.setuptools.packages.find]
include = ["ranker*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
]
ignore = [
    "S301",  # pickle -- documented risk, required for BM25 index
    "S603",  # subprocess -- not used
]

[tool.ruff.lint.isort]
known-first-party = ["ranker"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual adoption
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
