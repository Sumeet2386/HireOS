# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Gemini (Antigravity IDE)"
  - "GPT-4o-mini (weak label generation only)"

ai_usage_summary: |
  Used Gemini Antigravity IDE for architecture planning, code scaffolding,
  and competitive analysis. GPT-4o-mini used during offline pre-computation
  for weak label generation (stratified sample of 2,000 candidates scored
  on 0-10 relevance scale to train the LightGBM LTR model). No AI tools or
  network used during inference runtime. All candidate data processing is
  done locally via deterministic code.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid retrieval + ML re-ranking pipeline with adversarial honeypot detection.
  Stage 1: FAISS dense retrieval (bge-small-en-v1.5, top 5K) + BM25 sparse
  recall (top 500), unioned into ~5K shortlist. Stage 2: 50-feature extraction
  covering structural (title/YoE/career), skill (AI core count, proficiency,
  entailment), behavioral (activity decay, response rate, notice period), and
  location signals. Stage 3: LightGBM LambdaMART re-ranking trained on
  GPT-4o-mini weak labels (2K stratified sample). Stage 4: 6-layer honeypot
  pruning (timeline impossibility, skill-text entailment failure, tech maturity
  validation, career overlap, keyword stuffer detection, suspicious junior profiles).
  Stage 5: Deterministic rule-based reasoning per candidate. Runtime ~90s on
  CPU, 3.4MB feature matrix, 206MB BM25 index, ~150MB FAISS index.

# ============================================================================
# Declarations
# ============================================================================
declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
